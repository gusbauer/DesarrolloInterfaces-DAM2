<h1>Alumnos</h1>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Apellidos</th>
      <th>Email</th>
      <th>Fecha Nacimiento</th>
    </tr>
  </thead>
  <tbody>
    @for (alumno of alumnos; track alumno.id) {
      <tr>
        <td>{{ alumno.id }}</td>
        <td>{{ alumno.nombre }}</td>
        <td>{{ alumno.apellidos }}</td>
        <td>{{ alumno.email }}</td>
        <td>{{ alumno.fechaNacimiento }}</td>
      </tr>
    }
  </tbody>
</table>
